<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>小电拼</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-theme="warm" data-appearance="light">

<header class="topbar">
  <a class="brand" href="#/">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M11.6 12c-.9.8-2.3 1.3-3.9 1.3-1.8 0-3.1-.6-3.1-1.5s1.3-1.5 3.1-1.5c1.6 0 3 .5 3.9 1.3z"/>
        <path d="M12.4 12c.9-.8 2.3-1.3 3.9-1.3 1.8 0 3.1.6 3.1 1.5s-1.3 1.5-3.1 1.5c-1.6 0-3-.5-3.9-1.3z"/>
        <circle cx="12" cy="12" r="1.5"/>
      </svg>
    </span>
    <span class="brand-text"><strong>小电拼</strong><em>Web</em></span>
  </a>

  <div class="headline" id="headline">
    <div class="headline-label">合计功率</div>
    <div class="headline-value"><b id="total-watts">—</b><span class="unit">W</span></div>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="theme-btn" title="切换暖色 / 冷色" aria-label="切换配色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="icon-btn" id="appearance-btn" title="切换浅色 / 深色" aria-label="切换明暗">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
    <button class="icon-btn" id="settings-btn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
      </svg>
    </button>
  </div>
</header>

<main id="app" class="app"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
